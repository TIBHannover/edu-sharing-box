---
# For edu-sharing docker version we need to wait for responses up to 3 minutes
- name: Wait edu-sharing to come up.
  uri:
    url: '{{ edu_sharing_url }}'
    timeout: 60
    status_code: 200
  register: esresult
  until: esresult.status == 200
  retries: 30
  delay: 10

- name: Get access token.
  uri:
    url: '{{ edu_sharing_url }}/oauth2/token'
    method: POST
    body: 'grant_type=password&client_id=eduApp&client_secret=secret&username=admin&password={{ alf_password }}'
    return_content: yes
  register: accesstokenreply
  until: accesstokenreply.status == 200
  retries: 5
  delay: 10
  no_log: true

- name: Set access token.
  vars:
    jsonVar: '{{accesstokenreply.content | from_json}}'
  set_fact:
    accesstoken: '{{jsonVar.access_token}}'
  no_log: true

- name: Remove existing rendering-service (rendering2).
  uri:
    url: '{{edu_sharing_url}}/rest/admin/v1/applications/rendering2'
    method: DELETE
    body_format: json
    headers:
      Authorization: 'Bearer {{accesstoken}}'
      Accept: application/json
    status_code: [200, 500] # 500 if not existing
  no_log: true


- name: Remove edu_rendering_service_2.conf virtual host configuration
  become: true
  file:
    path: "/etc/apache2/sites-available/edu_rendering_service_2.conf"
    state: absent
  notify: restart apache2